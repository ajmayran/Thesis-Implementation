name: Build and deploy Python app to Azure Web App - Social-Work-Predictor

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create and start virtual environment
        run: |
          python -m venv antenv
          source antenv/bin/activate

      - name: Install dependencies
        run: |
          source antenv/bin/activate
          pip install -r requirements.txt

      - name: Run collectstatic
        run: |
          source antenv/bin/activate
          python manage.py collectstatic --noinput
        working-directory: thesis_project

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !antenv/
            !models/
            !.github/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D3E48CEC0802461EA0C4BAB865FD0460 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_12FA0A6CAEBA4F1EA96BFB5A13B97CC7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_57ACB56E3A1D433B81F61C9AF4F4574A }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'Social-Work-Predictor'
          slot-name: 'Production'
          startup-command: 'cd thesis_project && gunicorn thesis_project.wsgi:application --bind=0.0.0.0:8000'